```
<title>Tools</title>
<meta name="description" content="A collection of simple browser-based tools.">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f5;
        color: #171717;
    }

    header {
        max-width: 1100px;
        margin: 0 auto;
        padding: 64px 24px 32px;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 42px;
        letter-spacing: -1.5px;
    }

    header p {
        margin: 0;
        color: #666;
        font-size: 17px;
    }

    main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px 24px 64px;
    }

    .tools {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
    }

    .tool {
        display: block;
        padding: 24px;
        background: white;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        color: inherit;
        text-decoration: none;
        transition:
            transform 0.15s ease,
            border-color 0.15s ease,
            box-shadow 0.15s ease;
    }

    .tool:hover {
        transform: translateY(-2px);
        border-color: #ccc;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .tool h2 {
        margin: 0 0 8px;
        font-size: 19px;
    }

    .tool p {
        margin: 0;
        color: #666;
        line-height: 1.5;
        font-size: 14px;
    }

    footer {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px 32px;
        color: #888;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        header {
            padding-top: 40px;
        }

        h1 {
            font-size: 34px;
        }

        .tools {
            grid-template-columns: 1fr;
        }
    }
</style>
```

</head>

<body>

```
<header>
    <h1>Tools</h1>
    <p>Simple browser-based tools.</p>
</header>

<main>
    <div class="tools">

    </div>
</main>

<footer>
    &copy; 2026 Tools
</footer>
```

</body>
</html>
