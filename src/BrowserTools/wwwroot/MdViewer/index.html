<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Markdown Editor</title>

    <!-- Markdown parser -->
    <script src="../lib/marked.min.js"></script>

    <!-- GitHub README styling -->
    <link rel="stylesheet" href="../lib/github-markdown.min.css">

    <link rel="stylesheet" href="../static.css">

    <style>
        textarea {
            height: 90vh;
        }

        article {
            height: 90vh;
            text-align: justify;
        }

        .panel {
            width: 45vw;
            height: 90vh;
            display: inline-flex;
            justify-items: center;
            flex-direction: column;
            padding: 12px;
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            color: inherit;
            text-decoration: none;

        }

        .header {
            padding: 12px 16px;
            font-weight: 600;
            background: #fff;
            border-bottom: 1px solid #d0d7de;
        }

        .preview {
            flex: 1;
            overflow: auto;
            padding: 30px;
        }
    </style>
</head>

<body>
    <main>
        <div class="panel">
            <h2>Markdown</h2>
            <textarea id="markdown"></textarea>
        </div>

        <div class="panel">
            <h2>Preview</h2>
            <article id="output" class="markdown-body"></article>
        </div>

        <script>
            const markdown = document.getElementById("markdown");
            const output = document.getElementById("output");

            marked.setOptions({
                gfm: true,
                breaks: true
            });

            markdown.value = `# Markdown Preview

This looks like a GitHub README.

## Features

- Live preview
- GitHub styling
- Tables
- Task lists
- Code blocks

### Example

\`\`\`cpp
#include <iostream>

int main()
{
    std::cout << "Hello World";
    return 0;
}
\`\`\`

| Language | Rating |
|----------|-------:|
| C++ | ⭐⭐⭐⭐⭐ |
| JavaScript | ⭐⭐⭐⭐ |

> This is a blockquote.

- [x] Completed
- [ ] Todo

**Bold**

*Italic*

~~Strikethrough~~

`;

            function render() {
                output.innerHTML = marked.parse(markdown.value);
            }

            markdown.addEventListener("input", render);

            render();
        </script>
    </main>
</body>
</html>
